name: CI Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Get GitHub runner IP
      - name: Get GitHub Runner IP
        run: echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      # Add IP to MongoDB Atlas whitelist
      - name: Setup MongoDB Atlas Whitelist
        run: |
          curl -s -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" --digest \
          -H "Content-Type: application/json" \
          -X POST "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList" \
          -d "[{\"cidrBlock\": \"${RUNNER_IP}/32\", \"comment\": \"GitHub Actions\"}]"

      # Wait for Atlas propagation
      - name: Wait Atlas propagation
        run: sleep 40

      # Build containers
      - name: Build Docker Compose
        run: docker compose up -d --build
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          MEILI_API_KEY: ${{ secrets.MEILI_API_KEY }}

      # Wait for services
      - name: Wait for services
        run: sleep 20

      # Check backend health
      - name: Check backend health
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:3001; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 3
          done

          echo "Backend failed"
          docker logs kinetix-app
          exit 1

      # Check frontend health
      - name: Check frontend health
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:3000; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 3
          done

          echo "Frontend failed"
          docker logs kinetix-frontend
          exit 1

      # Test frontend -> backend
      - name: Test frontend API call
        run: |
          curl -s http://localhost:3000 | grep -i "<html" || exit 1

      # DB verification
      - name: Run DB verification
        run: docker exec kinetix-app npm run verify-db

      # Debug logs if failure
      - name: Show backend logs
        if: failure()
        run: docker logs kinetix-app

      - name: Show frontend logs
        if: failure()
        run: docker logs kinetix-frontend

      # Shutdown containers
      - name: Shutdown containers
        if: always()
        run: docker compose down

      # Remove IP from whitelist
      - name: Cleanup Whitelist
        if: always()
        run: |
          curl -s -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" --digest \
          -X DELETE "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList/${RUNNER_IP}%2F32"
