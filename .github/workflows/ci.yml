name: CI Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get GitHub Runner IP
        run: echo "RUNNER_IP=$(curl -s https://api.ipify.org)" >> $GITHUB_ENV

      # Open access to Atlas with Github's IP
      - name: Setup MongoDB Atlas Whitelist
        run: |
          curl -s -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" --digest \
          -H "Content-Type: application/json" \
          -X POST "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList" \
          -d "[{\"cidrBlock\": \"${RUNNER_IP}/32\", \"comment\": \"GitHub Actions\"}]"

      - name: Wait Atlas propagation
        run: sleep 40

        # Build containers with GitHub Secrets injected
      - name: Build Docker Compose
        run: docker compose up -d --build
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}

      # Wait for services
      - name: Wait for services
        run: sleep 20

      # Health check backend (retry safe)
      - name: Check backend health
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:3001; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 3
          done

          echo "Backend failed"
          docker logs kinetix-app
          exit 1

      # DB verification
      - name: Run DB verification
        run: docker exec kinetix-app npm run verify-db

      # Debug logs if failure
      - name: Show logs
        if: failure()
        run: docker logs kinetix-app

      # Cleanup always
      - name: Shutdown containers
        if: always()
        run: docker compose down

      # Cleanup whitelist of Atlas
      - name: Cleanup Whitelist
        if: always()
        run: |
          curl -s -u "${{ secrets.ATLAS_PUBLIC_KEY }}:${{ secrets.ATLAS_PRIVATE_KEY }}" --digest \
          -X DELETE "https://cloud.mongodb.com/api/atlas/v1.0/groups/${{ secrets.ATLAS_PROJECT_ID }}/accessList/${RUNNER_IP}%2F32"
