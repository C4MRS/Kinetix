name: CI Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build containers with GitHub Secrets injected
      - name: Build Docker Compose
        run: docker compose up -d --build
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}

      # Wait for services
      - name: Wait for services
        run: sleep 15

      # Health check backend (retry safe)
      - name: Check backend health
        run: |
          for i in {1..12}; do
            if curl -s http://localhost:3001; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 3
          done

          echo "Backend failed"
          docker logs kinetix-app
          exit 1

      # DB verification
      - name: Run DB verification
        run: docker exec kinetix-app npm run verify-db

      # Debug logs if failure
      - name: Show logs
        if: failure()
        run: docker logs kinetix-app

      # Cleanup always
      - name: Shutdown containers
        if: always()
        run: docker compose down
