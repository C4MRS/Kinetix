name: CI Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Start backend server
        run: |
          cd backend
          node server.js &
          sleep 5

      - name: Check server is running
        run: |
          curl -f http://localhost:3001 || exit 1

      - name: Run DB verification script
        run: |
          cd backend
          node scripts/verify-db.js
